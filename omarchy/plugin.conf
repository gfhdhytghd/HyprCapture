# Native plugin build recipe consumed by omarchy/plugin.
NAME=hyprcapture
TARGETS=(hyprcapture hyprcapture-ui hyprcapture-aec spa-aec-dtln)
FILES=(libhyprcapture.so hyprcapture-ui hyprcapture-aec libspa-aec-dtln.so)
PACKAGES=(cmake ninja pkgconf gcc lua glib2 nlohmann-json qt6-base qt6-svg qt6-wayland
  layer-shell-qt opencv libpulse libpipewire ffmpeg fftw wl-clipboard)
CMAKE_ARGS=(-DBUILD_TESTING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenVINO=ON)

# Bake the helper location into this build so no configuration is needed.
cmake_out_args() { echo "-DHYPRCAPTURE_DEFAULT_HELPER_PATH=$1/hyprcapture-ui"; }

stage_extras() {
  install -Dm755 "$DIR/scripts/install-aec.sh" "$1/hyprcapture-install-aec"
  install -Dm755 "$DIR/scripts/build-aec-runtime.sh" "$1/hyprcapture-build-aec-runtime"
  install -Dm644 "$DIR/resources/aec/DTLN-LICENSE.txt" "$1/licenses/DTLN-LICENSE.txt"
}
setup_extras() { "$1/hyprcapture-install-aec" "$1"; }

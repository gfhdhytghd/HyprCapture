# Native plugin build recipe consumed by omarchy/plugin.
NAME=hyprcapture
TARGETS=(hyprcapture hyprcapture-ui)
FILES=(libhyprcapture.so hyprcapture-ui)
PACKAGES=(cmake ninja pkgconf gcc lua glib2 nlohmann-json qt6-base qt6-svg qt6-wayland
  layer-shell-qt opencv libpulse libpipewire ffmpeg fftw wl-clipboard)
CMAKE_ARGS=(-DBUILD_TESTING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenVINO=ON)

# Bake the helper location into this build so no configuration is needed.
cmake_out_args() { echo "-DHYPRCAPTURE_DEFAULT_HELPER_PATH=$1/hyprcapture-ui"; }

stage_extras() {
  install -Dm755 "$DIR/scripts/install-aec.sh" "$1/hyprcapture-install-aec"
  install -Dm755 "$DIR/scripts/build-aec-runtime.sh" "$1/hyprcapture-build-aec-runtime"
  install -Dm644 "$DIR/resources/aec/DTLN-LICENSE.txt" "$1/licenses/DTLN-LICENSE.txt"
  [[ ! -x $1/hyprcapture-aec || ! -f $1/libspa-aec-dtln.so ]] || return 0
  if ! cmake --build "$CACHE/build" --target hyprcapture-aec spa-aec-dtln --parallel 2; then
    echo 'HyprCapture AEC components pending; normal capture remains available.' >&2
    return 0
  fi
  for component in hyprcapture-aec libspa-aec-dtln.so; do
    if ! install -Dm755 "$CACHE/build/$component" "$1/$component.part" ||
       ! mv "$1/$component.part" "$1/$component"; then
      echo 'HyprCapture AEC staging pending; normal capture remains available.' >&2
      return 0
    fi
  done
}
setup_extras() {
  # Runtime builds, downloads and checks must not hold up plugin loading.
  # In particular, release the inherited setup lock before going offline.
  (
    trap - EXIT
    trap '' HUP
    exec 9>&-
    exec </dev/null
    exec 8>"$CACHE/.aec-install.lock"
    flock -n 8 || exit 0
    exec >"$CACHE/aec-install.log" 2>&1
    if [[ ! -x $1/hyprcapture-aec ]]; then
      echo 'HyprCapture AEC worker unavailable; normal capture remains available.'
      exit 0
    fi
    "$1/hyprcapture-install-aec" "$1"
  ) &
}
